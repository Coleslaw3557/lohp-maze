<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoHP Maze Simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scene"></div>
<div id="crosshair" class="hidden">+</div>

<div id="panel">
  <header>
    <h2>LoHP Sim</h2>
    <span class="dot" id="dot-dmx" title="DMX frame feed">DMX</span>
    <span class="dot" id="dot-api" title="Server REST API">API</span>
    <span class="dot" id="dot-audio" title="Audio client (unit protocol)">AUD</span>
    <span class="dot" id="dot-rpi" title="Production server Pi">RPI</span>
  </header>

  <section>
    <div class="row">
      <button id="btn-view" title="Cycle Street / Noclip fly / Overhead plan (M). Street + plan: mouse wheel zooms, drag pans, E / R rotate. Noclip: click for mouse-look, WASD fly where you look, Space / C up / down, Shift fast">View</button>
      <button id="btn-respawn" title="Back to the entrance (first-person)">Respawn</button>
    </div>
    <div class="row">
      <button id="btn-daynight" title="Toggle day / night (N)">☀ Day</button>
      <button id="btn-towers" title="Show / hide the decorative entrance towers">Towers ✓</button>
      <button id="btn-camp" title="Camp ground plan at 4:30 & B — the whole lot from Jen's LotHP-26-v3.svg placement drawing at true scale (shade structures, trailer, communal carports, water, generator, cars, shared fuel)">Camp ✓</button>
      <button id="btn-sign" title="Show / hide the camp sign — 24 REAL DMX letter zones @161–352 (cad-items/camp-sign.svg)">Sign ✓</button>
      <button id="btn-steel" title="Show the custom hex deck steel (cad-items drawings) — cycles deck / roof / both; the ply ghosts while it's shown">Steel ✕</button>
      <button id="btn-mount" title="Cuddle projector MOUNT dimensions — the calculated LS625X arm/enclosure position off the NE deck corner, the corner-to-corner string line and the deck surface (fab spec: wiring-guides/cuddle-projector-mount.md)">Mount ✕</button>
      <button id="btn-eye" title="Cuddle orb — Guition JC3636W518C round display under the rear node box: an Olmec stone head whose ember eyes track the room's LD2450. Toggles off / Olmec">Eye: Olmec</button>
      <button id="btn-floor" title="Cuddle floor projection theme — ONE shared engine, every tab switches together: LAVA stepping stones / JUNGLE snakes on the moss floor / TEMPLE torch-lit flagstones / WATER stepping stones / CHAMBER trap doors + quicksand">Floor: …</button>
      <button id="btn-vidbase" hidden title="EXPERIMENT — base layer under the reactive floor show: AI-generated video loop (experiments/video-base) vs the production static texture">Base: Video</button>
    </div>
    <div class="row hidden" id="floor-filter">
      <button data-f="ground">Ground</button>
      <button data-f="upper">Upper</button>
      <button data-f="both" class="active">Both</button>
    </div>
  </section>

  <section>
    <h3>Theme</h3>
    <div class="row">
      <select id="theme-select"></select>
      <button id="btn-theme-set">Set</button>
    </div>
    <div class="row">
      <button id="btn-theme-next">Next ▶</button>
      <button id="btn-theme-off">No theme</button>
    </div>
    <label class="slider-row">Master brightness
      <input type="range" id="brightness" min="0" max="1" step="0.05" value="1">
    </label>
  </section>

  <section>
    <h3>Effects</h3>
    <div class="row">
      <select id="effect-select"></select>
    </div>
    <div class="row">
      <select id="room-select"></select>
      <button id="btn-effect-run">Run</button>
    </div>
    <div class="row">
      <button id="btn-effect-stop">Stop room</button>
      <button id="btn-effect-stopall">Stop all</button>
      <button id="btn-effect-all">Run in all</button>
    </div>
  </section>

  <section>
    <h3>Maze Ambience</h3>
    <div class="row">
      <button id="btn-maze-ambience-start">Start</button>
      <button id="btn-maze-ambience-stop">Stop</button>
    </div>
  </section>

  <section>
    <h3>Sound Mode</h3>
    <div class="row">
      <button id="btn-sound-mode" title="Attended = staff running people through fast: a second selection of shorter sounds (ambience, victory, cues — curated in the audio console's Attended view). Lights/DMX and the projector are identical in both modes. The server boots unattended; the entrance node's physical switch will use the same API.">Sounds: …</button>
    </div>
  </section>

  <details>
    <summary>Trigger sensors directly</summary>
    <div id="trigger-list"></div>
  </details>

  <details open>
    <summary>Fixtures (live DMX)</summary>
    <div id="sign-strip" title="Camp Sign letter zones @161–352, reading order (live DMX)"></div>
    <div id="fixture-grid"></div>
  </details>

  <details open>
    <summary>Event log</summary>
    <div id="log"></div>
  </details>

  <footer>
    <a id="cp-link" href="#" target="_blank">Server control panel ↗</a> ·
    <a id="audio-link" href="#" target="_blank" title="Audio pool console (tools/audio_console.py, port 5055) — pick the sounds each action, one-shot and bed plays; Attended view edits the staff-run selections">Audio console ↗</a>
  </footer>
</div>

<div id="toast" class="hidden"></div>
<div id="interact-hint" class="hidden">Press <b>E</b></div>

<script src="deck_steel.js"></script>
<script src="camp_layout_data.js"></script>
<script src="camp_layout.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
