# Exit sensor node — trigger map from triggers.json
# Exit is a ToF room, NOT radar — see packages/tof.yaml for why. The ToF
# publishes into tripwire for entry only; beam clear must not vacate the room.
substitutions:
  node_name: lohp-node-exit
  room: "Exit"
  effect: "Exit"
  server_host: "127.0.0.1"   # sim: local server; real node: 192.168.252.231
  api_port: "6075"
  host_mac: "06:35:69:00:00:0f"

packages:
  logic: !include ../packages/logic.yaml
  tripwire: !include ../packages/tripwire.yaml
  platform: !include ../packages/sim_host.yaml   # -> hardware_s3.yaml when flashing (S3 = fleet standard)

