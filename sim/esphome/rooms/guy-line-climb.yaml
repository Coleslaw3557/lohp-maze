# Guy Line Climb sensor node — trigger map from triggers.json
# REAL ROOM BOX (2026-08-20): flashed per the FLASH ADDS recipe — LD2410C ->
# tripwire -> ImageEnhancement + DMX out + audio, on the fleet-standard
# XIAO S3. (The box's FIRST board was a distributor-substituted ESP32-C6 —
# looks identical, esptool caught it; it ran the room for an hour with no
# audio and was permanently swapped for this S3 the same day. hardware_c6.yaml
# keeps that chip's pin map should another C6 ever sneak into a shipment.)
# S3 BENCH-VALIDATED 2026-08-20 evening: PHYSICAL radar entries + vacate ->
# telemetry (ImageEnhancement), gates read back 5/5/6, ArtDMX ~700-1300/min
# signal=yes, node audio attached (bed PLAYING vol 1.0) + live cue caught on
# serial (ANNOUNCING -> 22.05k mono WAV -> bed resume), OTA-tunnel INFO flip.
# BOARD-SWAP GOTCHA hit twice on the way: (1) the old board's dnsmasq lease
# held .64 so the S3 got a pool IP — purge the old lease on the RUT before
# the new board boots; (2) stale-hostapd Auth Expired loop on rejoin —
# restart hostapd on the Pi (runbook has both).
# Radar mounts at the TOP of the shaft pointed straight down (3.70 m above
# the floor, room-node-wiring-guide.md): the cone covers the whole floor and
# catches someone at the bottom however they arrived — doorway, ropes, or
# scaffolding. GATES WIDENED for that mount (defaults 2/3 reach only 2.25 m
# and would miss a walker at the floor): move gate 5 ~= 3.75 m spans the full
# shaft, still gate 6 holds someone flat at the floor edge. Downward past the
# floor is ground, not another bay, so the wide gates don't leak into
# neighbours. Re-check numbers at the real mount.
# To run this room in the sim again: platform back to sim_host.yaml, drop
# radar/dmx/audio/external_components/wifi/sensor/logger (tripwire stays —
# harness trip/vacate drives it on the host platform).
substitutions:
  node_name: lohp-node-guy-line-climb
  room: "Guy Line Climb"
  effect: "ImageEnhancement"
  server_host: "192.168.252.231"   # the server Pi (maze-network.md)
  api_port: "6064"
  host_mac: "06:35:69:00:00:04"    # sim-only (sim_host.yaml); unused on hardware
  dmx_tx_pin: "6"                  # D5, radar room (dmx-over-wifi.md)
  # Top-down mount, floor at 3.70 m. 2026-08-31 empty-maze test: 5/6 held the
  # room occupied after a leave (reach past the floor plane / out the doorway);
  # 4/5 keeps full-body coverage of anyone standing in the shaft footprint.
  ld2410_max_move_gate: "4"        # 3.00 m
  ld2410_max_still_gate: "5"       # 3.75 m ≈ the floor plane

packages:
  logic: !include ../packages/logic.yaml
  tripwire: !include ../packages/tripwire.yaml
  radar: !include ../packages/ld2410.yaml
  dmx: !include ../packages/dmx_out.yaml
  audio: !include ../packages/audio_s3.yaml
  victory_bank: !include victory/victory-guy-line-climb.yaml
  platform: !include ../packages/hardware_s3.yaml

external_components:   # for dmx_out.yaml — path is main-config-relative
  - source:
      type: local
      path: ../components

# Joins LOHP-ESP (rooms/secrets.yaml, post-cutover 2026-08-10 creds). No bssid
# pin and no fast_connect: single-AP LAN, and fast_connect + audio firmware
# caused WPA handshake loops on the Cop Dodge box (07-25). Keep the rescue AP.
wifi:
  ap:
    ssid: "LoHP-GuyLine"
    password: "hiddenplaya"

# On-playa diagnostics habit (bench-xiao-s3.yaml): RSSI visible from the server.
sensor:
  - platform: wifi_signal
    name: "${room} node RSSI"
    update_interval: 30s

# Room live-verified 2026-08-20 -> back at INFO (logic.yaml default). DEBUG
# was the bring-up setting; LD2410 frame spam at DEBUG also costs main-loop
# time.
logger:
  level: INFO
