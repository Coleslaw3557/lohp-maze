# Monkey Room sensor node — trigger map from triggers.json
# REAL ROOM BOX (2026-08-16): flashed per the FLASH ADDS recipe + the D1
# button contract (button_gpio_c3.example.yaml) + audio. VALIDATED same day,
# full physical chain: microswitch press -> MonkeyBusiness, par @121 gold
# flashes (DMX over WiFi), cue + ambience bed on the Pebble. RSSI −38 dBm at
# the bench; IP 192.168.252.72 (RUT reservation).
# RADAR ADDED same day (Tim's call — entry like the other rooms): LD2410C ->
# tripwire -> ShrineGuard (LotHT temple-guard ambush sting + torch-flare
# lights, effects/monkey_shrine.py). The BUTTON stays the puzzle win: closed
# by the silver monkey assembly seating home -> MonkeyBusiness.
# To run this room in the sim again: platform back to sim_host.yaml, drop
# button_hw/radar/dmx/audio/external_components/wifi/sensor/logger (tripwire
# stays — harness trip/vacate drives it on the host platform).
substitutions:
  node_name: lohp-node-monkey
  room: "Monkey Room"
  effect: "ShrineGuard"
  button_effect: "MonkeyBusiness"
  server_host: "192.168.252.231"   # the server Pi (maze-network.md)
  api_port: "6072"
  host_mac: "06:35:69:00:00:0c"    # sim-only (sim_host.yaml); unused on hardware
  button_pin: GPIO2                # S3 D1 — fleet button contract (DB9-A pin 3)
  dmx_tx_pin: "6"                  # D5, radar room (dmx-over-wifi.md)

packages:
  logic: !include ../packages/logic.yaml
  tripwire: !include ../packages/tripwire.yaml
  radar: !include ../packages/ld2410.yaml
  button: !include ../packages/button.yaml
  button_hw: !include ../packages/button_gpio_c3.example.yaml
  dmx: !include ../packages/dmx_out.yaml
  audio: !include ../packages/audio_s3.yaml
  platform: !include ../packages/hardware_s3.yaml

external_components:   # for dmx_out.yaml — path is main-config-relative
  - source:
      type: local
      path: ../components

# Joins LOHP-ESP (rooms/secrets.yaml, post-cutover 2026-08-10 creds). No bssid
# pin and no fast_connect: single-AP LAN, and fast_connect + audio firmware
# caused WPA handshake loops on the Cop Dodge box (07-25). Keep the rescue AP.
wifi:
  ap:
    ssid: "LoHP-Monkey"
    password: "hiddenplaya"

# On-playa diagnostics habit (bench-xiao-s3.yaml): RSSI visible from the server.
sensor:
  - platform: wifi_signal
    name: "${room} node RSSI"
    update_interval: 30s

# Bring-up visibility: button + POST logs at DEBUG. Drop back to INFO
# (logic.yaml default) via OTA once validated.
logger:
  level: DEBUG
