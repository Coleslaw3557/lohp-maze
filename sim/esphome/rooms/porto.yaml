# Porto Room sensor node — trigger map from triggers.json
# REAL ROOM BOX (2026-08-20): flashed per the FLASH ADDS recipe — the 3-pad
# knock game lives on THIS node (game_porto.yaml + game_porto_hw.yaml, piezos
# on D0-D2 via DB9 port A pins 3-5; 1MΩ bleed resistors to GND at the XIAO so
# the ADC pins rest quiet with the pod unplugged) + LD2410C radar -> tripwire
# -> PortoStandBy + DMX out + audio.
# PHYSICAL KNOCKS VALIDATED same day, all 3 pads read as separate channels
# (bare discs: 0.5-1.3V per knock; knock->sound ~0.3s). ON-SITE INSTALL:
# discs bond BEHIND PLYWOOD — recalibrate porto_piezo_threshold (0.5 now;
# pad 2 grazed it bare) and porto_piezo_cooldown_ms (600; pad 1 rang past
# it once — ply sustains longer, try 900) from the "pad N hit (x.xxV)"
# INFO logs over OTA.
# To run this room in the sim again: platform back to sim_host.yaml, drop
# game_hw/radar/dmx/audio/external_components/wifi/sensor/logger (tripwire +
# game stay — harness trip/vacate/press_porto drives them on the host platform).
substitutions:
  node_name: lohp-node-porto
  room: "Porto Room"
  effect: "PortoStandBy"
  entry_hook: "id(porto_randomize)->execute();"
  leave_hook: "id(porto_entry_seeded) = false; id(porto_attempts) = 0; id(porto_solved) = false;"
  server_host: "192.168.252.231"   # the server Pi (maze-network.md)
  api_port: "6066"
  host_mac: "06:35:69:00:00:06"    # sim-only (sim_host.yaml); unused on hardware
  dmx_tx_pin: "6"                  # D5, radar room (dmx-over-wifi.md)

packages:
  logic: !include ../packages/logic.yaml
  tripwire: !include ../packages/tripwire.yaml
  radar: !include ../packages/ld2410.yaml
  game: !include ../packages/game_porto.yaml
  game_hw: !include ../packages/game_porto_hw.yaml
  dmx: !include ../packages/dmx_out.yaml
  audio: !include ../packages/audio_s3.yaml
  victory_bank: !include victory/victory-porto-room.yaml
  platform: !include ../packages/hardware_s3.yaml

external_components:   # for dmx_out.yaml — path is main-config-relative
  - source:
      type: local
      path: ../components

# Joins LOHP-ESP (rooms/secrets.yaml, post-cutover 2026-08-10 creds). No bssid
# pin and no fast_connect: single-AP LAN, and fast_connect + audio firmware
# caused WPA handshake loops on the Cop Dodge box (07-25). Keep the rescue AP.
wifi:
  ap:
    ssid: "LoHP-Porto"
    password: "hiddenplaya"

# On-playa diagnostics habit (bench-xiao-s3.yaml): RSSI visible from the server.
sensor:
  - platform: wifi_signal
    name: "${room} node RSSI"
    update_interval: 30s

# Bring-up visibility: piezo/game + POST logs at DEBUG. Drop back to INFO
# (logic.yaml default) via OTA once validated.
logger:
  level: DEBUG
