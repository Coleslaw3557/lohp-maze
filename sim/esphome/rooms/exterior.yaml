# Exterior flood bridge — 3× ILC 80W RGBW BLE floods (Amazon 2026-08-11,
# "BLFL" family, APP: BRmesh = Broadlink Fastcon) washing the camp frontage
# with the maze theme. Born 2026-08-31 (Tim, on playa: "handle this as part
# of the maze/theme instead of me using some app").
#
# HARDWARE node (the spare XIAO C6 from the Guy Line ship mix-up): no wired
# DMX, no audio (C6 has no PSRAM; BLE+audio are mutually exclusive fleet-wide
# anyway — room-node-audio-plan.md). The server treats "Exterior" as one more
# Art-Net room (fixtures at DMX 353/361/369, light_config.json); this node
# receives the same unicast universe and re-broadcasts each fixture block as
# Fastcon BLE advertisements (components/artnet_fastcon -> components/fastcon).
# The floods relay commands to each other, so ONE bridge in range of ANY
# flood drives all three.
#
# PAIRING (app-free, one-time per flood set): floods powered + factory-fresh
# (if ever app-paired: power-cycle 5x to reset), then call the pair_floods
# API action — the node wake-probes, assigns light ids 1..3 + our mesh key
# (secrets: fastcon_mesh_key), lights flash to confirm; watch the node log.
# BLE is fire-and-forget: no state readback, sends are change-detected and
# each flood is repainted every ~5s (generator power cuts self-heal).
#
# Flash (USB on the dev box):   cd sim/esphome && ./run_node.sh exterior
# Field OTA: same tunnel recipe as every node (room-node-bringup.md).
# IP .77 is baked below (manual_ip) — ALSO add the RUT DHCP reservation for
# the C6's MAC so the pool can never hand .77 to a phone.
substitutions:
  node_name: lohp-node-exterior
  room: "Exterior"
  server_host: "192.168.252.231"   # the server Pi (maze-network.md)
  api_port: "6077"                 # node IP = api_port - 6000 -> .77

packages:
  logic: !include ../packages/logic.yaml
  platform: !include ../packages/hardware_c6.yaml

external_components:   # path is main-config-relative
  - source:
      type: local
      path: ../components

wifi:
  ap:
    ssid: "LoHP-Exterior"
    password: "hiddenplaya"
  manual_ip:
    static_ip: 192.168.252.77
    gateway: 192.168.252.1
    subnet: 255.255.255.0

esp32_ble:

esp32_ble_tracker:
  scan_parameters:
    active: true
    continuous: false   # scanning only runs during the pairing window

fastcon:
  id: fastcon_ctl
  mesh_key: !secret fastcon_mesh_key

light:
  - platform: fastcon
    id: flood_1
    name: "${room} flood 1"
    light_id: 1
    controller_id: fastcon_ctl
  - platform: fastcon
    id: flood_2
    name: "${room} flood 2"
    light_id: 2
    controller_id: fastcon_ctl
  - platform: fastcon
    id: flood_3
    name: "${room} flood 3"
    light_id: 3
    controller_id: fastcon_ctl

artnet_fastcon:
  controller_id: fastcon_ctl
  universe: "0"
  floods:
    - light_id: 1
      start_address: 353
    - light_id: 2
      start_address: 361
    - light_id: 3
      start_address: 369
  signal:
    name: "${room} DMX signal"   # false = no ArtDMX for 5s -> check WiFi first

script:
  - id: pair_sequence
    mode: restart
    then:
      - esp32_ble_tracker.start_scan:
          continuous: true
      - lambda: 'id(fastcon_ctl).start_pairing(25000);'
      - delay: 27s
      - esp32_ble_tracker.stop_scan:
      - lambda: 'ESP_LOGI("pairing", "Done: %s", id(fastcon_ctl).pairing_summary().c_str());'

api:
  actions:
    - action: pair_floods
      then:
        - script.execute: pair_sequence
    - action: stop_pairing
      then:
        - lambda: 'id(fastcon_ctl).stop_pairing();'
        - script.stop: pair_sequence
        - esp32_ble_tracker.stop_scan:

sensor:
  - platform: wifi_signal
    name: "${room} node RSSI"
    update_interval: 30s

logger:
  level: INFO
