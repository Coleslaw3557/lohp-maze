# Photo Bomb Room sensor node — trigger map from triggers.json
# Tripwire starts the room's music bed; the shutter BUTTON starts the camera
# sequence (3s pose countdown -> flash -> the Pi's USB webcam takes the photo).
# The server owns the game rules (photobooth.py): 5 shots per visitor, then
# presses fail until the room turns over.
substitutions:
  node_name: lohp-node-photo-bomb
  room: "Photo Bomb Room"
  effect: "PhotoBomb-BG"
  button_effect: "PhotoBomb-Shot"
  button_cooldown: "5s"   # faster booth: covers the 4.4s shot sequence
  server_host: "127.0.0.1"   # sim: local server; real node: 192.168.1.238
  api_port: "6068"
  host_mac: "06:35:69:00:00:08"

packages:
  logic: !include ../packages/logic.yaml
  tripwire: !include ../packages/tripwire.yaml
  button: !include ../packages/button.yaml       # + button_gpio_c3.example.yaml on hardware
  platform: !include ../packages/sim_host.yaml   # -> hardware_s3.yaml when flashing (S3 = fleet standard)

