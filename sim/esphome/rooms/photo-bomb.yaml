# Photo Bomb Room sensor node — trigger map from triggers.json
# Tripwire starts the room's ambience bed; the shutter BUTTON is the camera
# shutter (instant flash at press, 2026-08-22 -> the Pi's USB webcam grabs the
# photo during the ~2.2s flash hold).
# The server owns the game rules (photobooth.py): 5 shots per visitor, then
# presses fail until the room turns over.
# REAL ROOM BOX (2026-08-21): flashed per the FLASH ADDS recipe — LD2410C +
# shutter button on the D1 fleet contract (DB9-A pin 3) + DMX on D5 + audio.
# IP 192.168.252.68 (RUT reservation). VALIDATED same day: radar entry/vacate/
# re-trip (bench-physical) + all four booth paths — entry bed, shot->synthetic
# capture + CorrectAnswer camera cue, 6th-press budget fail (WrongAnswer),
# vacate turnover reset -> capture again; ArtDMX 840/min signal=yes +
# Lightning; node audio attached (bed PLAYING); telemetry mirrored every POST.
# PhotoBomb-Shot is lights-only BY DESIGN (countdown mp3 retired-by-console).
# To run this room in the sim again: platform back to sim_host.yaml, drop
# button_hw/radar/dmx/audio/external_components/wifi/sensor/logger AND the
# media_player/binary_sensor snap extends (they reference audio_s3 ids;
# tripwire stays — harness trip/vacate drives it on the host platform).
substitutions:
  node_name: lohp-node-photo-bomb
  room: "Photo Bomb Room"
  effect: "PhotoBomb-BG"
  button_effect: "PhotoBomb-Shot"
  button_cooldown: "2s"   # burst booth (Tim 08-22): 5 shots fit in ~9s, inside the 15s window; still covers the 1.0s flash + 0.3s warm capture
  server_host: "192.168.252.231"   # the server Pi (maze-network.md)
  api_port: "6068"
  host_mac: "06:35:69:00:00:08"    # sim-only (sim_host.yaml); unused on hardware
  button_pin: GPIO2                # S3 D1 — fleet button contract (DB9-A pin 3)
  dmx_tx_pin: "6"                  # D5, radar room (dmx-over-wifi.md)

packages:
  logic: !include ../packages/logic.yaml
  tripwire: !include ../packages/tripwire.yaml
  radar: !include ../packages/ld2410.yaml
  button: !include ../packages/button.yaml
  button_hw: !include ../packages/button_gpio_c3.example.yaml
  dmx: !include ../packages/dmx_out.yaml
  audio: !include ../packages/audio_s3.yaml
  victory_bank: !include victory/victory-photo-bomb-room.yaml
  platform: !include ../packages/hardware_s3.yaml

external_components:   # for dmx_out.yaml — path is main-config-relative
  - source:
      type: local
      path: ../components

# Joins LOHP-ESP (rooms/secrets.yaml, post-cutover creds). No bssid pin and no
# fast_connect: single-AP LAN (maze-network.md). Keep the rescue AP.
wifi:
  ap:
    ssid: "LoHP-PhotoBomb"
    password: "hiddenplaya"

# INSTANT SNAP (2026-08-22, Tim): the camera-click WAV lives IN THE FLASH and
# plays at the press edge — zero network in the loop (the streamed click landed
# ~3s after the press). Room-local exception to audio_s3.yaml's
# nothing-stored-on-nodes rule, Tim's explicit call for this one
# latency-critical cue. EVERY press edge clicks (the 5s cooldown gates only the
# shot POST — a real camera clicks even when it won't shoot); the server's
# photo-landed confirmation is lights-only (PhotoBomb-Landed) so nothing
# double-clicks. The WAV is a baked cue (22.05k mono, volume pre-mixed), played
# on the announcement pipeline so it ducks the bed like streamed cues do.
media_player:
  - id: !extend room_audio
    files:
      - id: snap_wav
        file: ../../../audio_files/cues/tf_camera_05.wav

binary_sensor:
  - id: !extend push_button
    on_press:
      then:
        - media_player.speaker.play_on_device_media_file:
            id: room_audio
            media_file: snap_wav
            announcement: true

# On-playa diagnostics habit (bench-xiao-s3.yaml): RSSI visible from the server.
sensor:
  - platform: wifi_signal
    name: "${room} node RSSI"
    update_interval: 30s

# Validated 2026-08-21 — INFO (logic.yaml default) via the OTA tunnel.
logger:
  level: INFO
