# Cop Dodge sensor node — trigger map from triggers.json
# FIRST REAL ROOM BOX (2026-07-25): flashed per the FLASH ADDS recipe below +
# packages/ld2410.yaml (radar -> tripwire). To run this room in the sim again:
# platform back to sim_host.yaml, drop radar/dmx/external_components/wifi.
# REFLASHED 2026-08-21 (the pending post-cutover reflash): fleet-standard
# WiFi (house-AP bssid pin + fast_connect dropped), first box flashed
# straight onto the RUT140 AP (radio swap same day) — reserved .62 on first
# DHCP, server keepalive attached in ~1s. VALIDATED: trip -> PoliceLights +
# occupied colour lock, vacate -> leave sting 0x84 + lock off, ArtDMX
# 817/min signal=yes, Lightning + thunder cue, cue WAV fetches live.
# Line-out listen check = Tim's ears at the box (the standing dead-channel
# hardware question). Logger DEBUG->INFO via the field-OTA smoke same day.
substitutions:
  node_name: lohp-node-cop-dodge
  room: "Cop Dodge"
  effect: "PoliceLights"
  server_host: "192.168.252.231"   # the server Pi (maze-network.md); bench server on dev box: its LOHP-ESP address
  api_port: "6062"
  host_mac: "06:35:69:00:00:02"    # sim-only (sim_host.yaml); unused on hardware
  dmx_tx_pin: "6"                  # D5, radar room (dmx-over-wifi.md)
  # This room has an audible leave sting. Keep the send-off close to the
  # actual exit instead of the default ~10s empty-room grace chain.
  ld2410_module_timeout_s: "1"
  absence_timeout: 0s

packages:
  logic: !include ../packages/logic.yaml
  tripwire: !include ../packages/tripwire.yaml
  radar: !include ../packages/ld2410.yaml
  dmx: !include ../packages/dmx_out.yaml
  audio: !include ../packages/audio_s3.yaml
  # WiFi mystery RESOLVED 07-25: antenna snap connector was unplugged (knocked
  # loose during the speaker/DAC install) — never firmware.
  # Audio 2026-07-25 (Tim): NOTHING stored on the chip — cues stream from the
  # server as announcement URLs (node_audio_manager.py); the one-cue lite
  # package + 8MB-USB-reflash detour is dead.
  platform: !include ../packages/hardware_s3.yaml

external_components:   # for dmx_out.yaml — path is main-config-relative
  - source:
      type: local
      path: ../components

# Fleet-standard WiFi (reflash 2026-08-21): the old house-AP bssid pin and
# fast_connect are gone — single-AP LAN (LOHP-ESP, on the RUT140 since the
# 08-21 radio swap), and fast_connect + audio firmware caused WPA handshake
# loops on this very box (07-25). Keep the rescue AP.
wifi:
  ap:
    ssid: "LoHP-Cop-Dodge"
    password: "hiddenplaya"

# On-playa diagnostics habit (bench-xiao-s3.yaml): RSSI visible from the server.
sensor:
  - platform: wifi_signal
    name: "${room} node RSSI"
    update_interval: 30s

# Room live-verified 2026-08-21 -> back at INFO (logic.yaml default); DEBUG
# was the bring-up setting.
logger:
  level: INFO
