# Sparkle Pony Room sensor node — trigger map from triggers.json
substitutions:
  node_name: lohp-node-sparkle-pony
  room: "Sparkle Pony Room"
  effect: "SparkPony"
  server_host: "127.0.0.1"   # sim: local server; real node: 192.168.252.231
  api_port: "6065"
  host_mac: "06:35:69:00:00:05"
  # This room has an audible leave sting. When flashed with radar, report empty
  # promptly so the send-off lands as the visitor exits.
  ld2410_module_timeout_s: "1"
  absence_timeout: 0s

packages:
  logic: !include ../packages/logic.yaml
  tripwire: !include ../packages/tripwire.yaml
  platform: !include ../packages/sim_host.yaml   # -> hardware_s3.yaml when flashing (S3 = fleet standard)

