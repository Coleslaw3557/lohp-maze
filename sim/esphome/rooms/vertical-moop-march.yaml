# Vertical Moop March sensor node — trigger map from triggers.json
# REAL ROOM BOX (2026-08-17): flashed per the FLASH ADDS recipe — the 4-button
# march game lives on THIS node (game_moop.yaml + game_moop_hw.yaml, buttons
# D0-D3 via DB9 port A pins 3-6 and the button pod; 2026-08-16 revert of the
# standalone battery C3 pucks) + DMX out + audio.
# RADAR ADDED same day (Tim's call — entry like the other rooms): LD2410C ->
# tripwire -> MoopMarch (the audit's reserved name: leave-no-trace green
# fall-in, descending march cadence, amber moop-spotted snatch;
# effects/moop_march.py, light-only until the room's audio pack is authored).
# Top-down mount 1.80 m over the floor it watches — default gates cover a
# body underneath; re-check gate numbers at the real mount.
# To run this room in the sim again: platform back to sim_host.yaml, drop
# game_hw/radar/dmx/audio/external_components/wifi/sensor/logger (tripwire
# stays — harness trip/vacate drives it on the host platform).
substitutions:
  node_name: lohp-node-vertical-moop-march
  room: "Vertical Moop March"
  effect: "MoopMarch"
  server_host: "192.168.252.231"   # the server Pi (maze-network.md)
  api_port: "6074"
  host_mac: "06:35:69:00:00:0e"    # sim-only (sim_host.yaml); unused on hardware
  dmx_tx_pin: "6"                  # D5, radar room (dmx-over-wifi.md)
  # Pinned at the pre-2026-08-31 values when the package default dropped to 2:
  # top-down shaft mount needs the reach (still 2.25 m barely covers heads at
  # the bottom). Its 08-31 walk-through was corrupted (tunnel dropout) — retune
  # from a clean test, don't inherit the wing-bay cut.
  ld2410_max_move_gate: "2"
  ld2410_max_still_gate: "3"

packages:
  logic: !include ../packages/logic.yaml
  tripwire: !include ../packages/tripwire.yaml
  radar: !include ../packages/ld2410.yaml
  game: !include ../packages/game_moop.yaml
  game_hw: !include ../packages/game_moop_hw.yaml
  dmx: !include ../packages/dmx_out.yaml
  audio: !include ../packages/audio_s3.yaml
  victory_bank: !include victory/victory-vertical-moop-march.yaml
  platform: !include ../packages/hardware_s3.yaml

external_components:   # for dmx_out.yaml — path is main-config-relative
  - source:
      type: local
      path: ../components

# Joins LOHP-ESP (rooms/secrets.yaml, post-cutover 2026-08-10 creds). No bssid
# pin and no fast_connect: single-AP LAN, and fast_connect + audio firmware
# caused WPA handshake loops on the Cop Dodge box (07-25). Keep the rescue AP.
wifi:
  ap:
    ssid: "LoHP-MoopMarch"
    password: "hiddenplaya"

# On-playa diagnostics habit (bench-xiao-s3.yaml): RSSI visible from the server.
sensor:
  - platform: wifi_signal
    name: "${room} node RSSI"
    update_interval: 30s

# Room live-verified 2026-08-17 -> back at INFO (logic.yaml default). DEBUG
# was the bring-up setting; LD2410 frame spam at DEBUG also costs main-loop
# time the button path doesn't need to pay.
logger:
  level: INFO
