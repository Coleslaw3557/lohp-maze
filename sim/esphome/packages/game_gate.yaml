# Gate crossing game — 6 illuminated 30mm arcade buttons in two SERIES banks
# of 3 (redrawn 2026-08-21: no MCP23017 on hand, and none needed — each
# bank's three N.O. switches wire in series, so the circuit only closes while
# the visitor's body press holds ALL THREE at once; the simultaneity check
# moved from firmware into copper). The node sees just two inputs:
#   bank A (pads 1-3) closes                 -> CorrectAnswer chime + 30s stage window
#   bank B (pads 4-6) inside the window      -> CorrectAnswer chime (complete)
#   bank B un-armed (no bank A yet, window expired, or already completed)
#                                            -> WrongAnswer
# Spec: wiring-guides/room-games-plan.md. Sim/harness closes a whole bank:
#   call <host>:<port> press_bank bank=1   (bank 2 = pads 4-6)
# Real S3 wiring (game_gate_hw.yaml): bank A on D0, bank B on D1, via DB9-A
# pins 8/9; button LEDs hardwired to the 5V rail.
substitutions:
  gate_complete_effect: "CorrectAnswer"

globals:
  - id: gate_stage_ms
    type: uint32_t
    initial_value: '0'

api:
  actions:
    - action: press_bank
      variables:
        bank: int
      then:
        - lambda: |-
            if (bank == 1) id(gate_bank_a).publish_state(true);
            if (bank == 2) id(gate_bank_b).publish_state(true);
        - delay: 120ms
        - lambda: |-
            if (bank == 1) id(gate_bank_a).publish_state(false);
            if (bank == 2) id(gate_bank_b).publish_state(false);

binary_sensor:
  - platform: template
    id: gate_bank_a
    name: "${room} bank A"
    publish_initial_state: true
    on_press:
      then: [script.execute: gate_bank_a_closed]
  - platform: template
    id: gate_bank_b
    name: "${room} bank B"
    publish_initial_state: true
    on_press:
      then: [script.execute: gate_bank_b_closed]

script:
  - id: gate_bank_a_closed
    mode: single   # single = built-in cooldown while the script sleeps
    then:
      - lambda: 'id(gate_stage_ms) = millis();'
      - logger.log: "Gate bank A closed — chime, stage armed"
      - script.execute:
          id: gate_fire
          effect: "CorrectAnswer"
      - delay: 2s
  - id: gate_bank_b_closed
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(gate_stage_ms) != 0 && (millis() - id(gate_stage_ms)) < 30000;'
          then:
            - lambda: 'id(gate_stage_ms) = 0;'
            - logger.log: "Gate bank B inside the window — chime"
            - script.execute:
                id: gate_fire
                effect: "${gate_complete_effect}"
          else:
            - logger.log: "Gate bank B un-armed — fail"
            - script.execute:
                id: gate_fire
                effect: "WrongAnswer"
      - delay: 2s
  - id: gate_fire
    mode: queued
    parameters:
      effect: string
    then:
      - http_request.post:
          url: http://${server_host}:5000/api/run_effect
          request_headers:
            Content-Type: application/json
          json: !lambda |-
            root["room"] = "${room}";
            root["effect_name"] = effect;
