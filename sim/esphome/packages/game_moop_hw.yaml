# REAL-HARDWARE companion to game_moop.yaml: the four march buttons on the
# room S3, D0-D3 -> DB9 port A pins 3-6 -> the room's button pod
# (db9-field-wiring.md). Each GPIO edge feeds the same `moop_press` script the
# sim/harness uses, so the round logic stays identical. Buttons are closures
# to GND (internal pull-up, pressed = LOW); 30ms delayed_on = the fleet
# debounce. XIAO S3 Dx -> GPIO: D0=1 D1=2 D2=3 D3=4 (hardware_s3.yaml note).
# NOT validated by validate_all.sh (gpio needs the esp32 platform, sim nodes
# are host-platform).
substitutions:
  moop_btn1_pin: GPIO1   # D0 — DB9-A pin 3
  moop_btn2_pin: GPIO2   # D1 — DB9-A pin 4
  moop_btn3_pin: GPIO3   # D2 — DB9-A pin 5
  moop_btn4_pin: GPIO4   # D3 — DB9-A pin 6

binary_sensor:
  - platform: gpio
    id: moop_btn1_hw
    pin:
      number: ${moop_btn1_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - script.execute:
            id: moop_press
            n: 1
  - platform: gpio
    id: moop_btn2_hw
    pin:
      number: ${moop_btn2_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - script.execute:
            id: moop_press
            n: 2
  - platform: gpio
    id: moop_btn3_hw
    pin:
      number: ${moop_btn3_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - script.execute:
            id: moop_press
            n: 3
  - platform: gpio
    id: moop_btn4_hw
    pin:
      number: ${moop_btn4_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      then:
        - script.execute:
            id: moop_press
            n: 4
