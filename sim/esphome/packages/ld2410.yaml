# LD2410C presence radar -> the room's occupancy pair (packages/tripwire.yaml).
# 12 of the 15 rooms use this. Cuddle Cross runs packages/ld2450.yaml instead
# (2026-08-20: its tracking radar took over presence; the 2410C left that box).
# Entrance and Exit use packages/tof.yaml instead —
# radar can't work there without foiling their shared divider, which was ruled out
# 2026-07-30. Guy Line Climb and Vertical Moop March DID move to radar that day:
# their boxes sit at the TOP of the room pointed straight down, so the cone covers
# the whole shaft floor and catches someone at the bottom whether they came in
# through the doorway or climbed down the ropes or the scaffolding.
#
# HARDWARE-FLASH package (like dmx_out.yaml): real S3 builds only — the host
# platform has no UART; sim rooms drive the same two scripts through the
# `trip` / `vacate` api actions instead.
#
#   packages:
#     radar: !include ../packages/ld2410.yaml   # alongside tripwire.yaml
#   substitutions:
#     absence_timeout: 5s    # dwell rooms override — see the table below
#
# Wiring (room-node-wiring-guide.md): radar Tx -> D7/GPIO44 (node RX),
# radar Rx <- D6/GPIO43 (node TX), VCC <- 5V rail, OUT unconnected.
# Hi-Link manual: UART 256000 8N1. dmx_out.yaml owns UART2 and the logger
# owns USB-JTAG, so this auto-assigns UART0/1 — no explicit uart_num needed.
#
# The two edges come off two DIFFERENT radar outputs, deliberately:
#
#   ENTER = has_moving_target rising edge. A person walking in is always moving,
#     and a moving-target edge cannot be produced by furniture, so the effect
#     that fires here can't be triggered by the room's own contents. It pulses
#     the shared tripwire rather than POSTing directly, keeping debounce, the 5s
#     cooldown, first-event handling and the harness `trip` action in one place.
#
#   LEAVE = has_target falling edge, after `absence_timeout` of nothing.
#     has_target covers moving OR still, so someone who walks in and then stands
#     perfectly still still counts as present — using the moving output here
#     would declare the room empty the moment they held a pose. delayed_off adds
#     the grace period on top of the radar's own absence delay so a momentary
#     dropout mid-visit can't fire a spurious leave.
#
# Absence timeout per room (room-node-enclosure-plan.md): 5s standard,
# 60s on dwell rooms where standing still and staying a while IS the point and
# an early leave would cut the room off (No Friends Monday here; Cuddle gets
# its 60s from the same substitution in ld2450.yaml).
# Rooms with audible send-off stings may override both timeouts shorter so the
# leave sound lands close to the visitor's actual exit.
#
# Range containment:
# The maze bays are back-to-back/stacked, and bare ply does not reliably block
# 24 GHz radar. The sim clips each radar wedge to its room, but real LD2410s
# only know radial distance gates. Use a short moving gate for ENTER so adjacent
# rooms do not fire the effect. With the LD2410 default 0.75 m resolution:
#
#   gate 2 ~= 1.50 m  (entry-side trigger envelope, and the bay depth)
#   gate 3 ~= 2.25 m
#
# 2026-08-31 on-playa empty-maze walk-through: still gate 3 latched a phantom
# still target after every real leave (the 1.52 m-deep back wall/legs sit at
# the gate 2/3 boundary) and held onto people standing in the next bay. Still
# gate dropped 3 -> 2 maze-wide; rooms read empty again the moment the decay
# runs out. Cost: a person holding perfectly still in the far corner (>1.5 m
# radial) can drop out until they move — absence_timeout bridges the gap.
# The climb shafts point down and override these substitutions per room.

substitutions:
  absence_timeout: 5s
  ld2410_module_timeout_s: "5"
  ld2410_max_move_gate: "2"
  ld2410_max_still_gate: "2"
  # Radar UART sits at Dx positions D6/D7 fleet-wide; the GPIO numbers differ
  # per XIAO chip. Defaults = S3 (the fleet standard); a C6 box overrides to
  # GPIO16/GPIO17 (hardware_c6.yaml has the full map).
  radar_tx_pin: GPIO43   # D6 -> radar Rx
  radar_rx_pin: GPIO44   # D7 <- radar Tx

esphome:
  on_boot:
    priority: -100
    then:
      # Program the radar module itself, not just the ESPHome-side debounce.
      # `number.set` calls the LD2410 config command once all three values exist.
      - number.set:
          id: radar_module_timeout
          value: ${ld2410_module_timeout_s}
      - number.set:
          id: radar_max_move_gate
          value: ${ld2410_max_move_gate}
      - number.set:
          id: radar_max_still_gate
          value: ${ld2410_max_still_gate}

uart:
  id: radar_uart
  tx_pin: ${radar_tx_pin}
  rx_pin: ${radar_rx_pin}
  baud_rate: 256000

ld2410:
  uart_id: radar_uart

number:
  - platform: ld2410
    timeout:
      id: radar_module_timeout
      name: "${room} radar module timeout"
    max_move_distance_gate:
      id: radar_max_move_gate
      name: "${room} radar max moving gate"
    max_still_distance_gate:
      id: radar_max_still_gate
      name: "${room} radar max still gate"

binary_sensor:
  - platform: ld2410
    has_target:
      name: "${room} radar presence"
      id: radar_presence
      filters:
        - delayed_off: ${absence_timeout}
      on_release:
        then:
          - script.execute: room_vacated
    has_moving_target:
      name: "${room} radar moving"
      on_press:
        then:
          - binary_sensor.template.publish:
              id: tripwire
              state: ON
          - delay: 250ms
          - binary_sensor.template.publish:
              id: tripwire
              state: OFF
