# Bike Lock Room quiz — one multiple-choice question, 4 arcade buttons.
#   option 3                    -> ${bike_complete_effect} ONLY (lights + victory
#                                  audio in one effect, instantly on the press —
#                                  Tim 2026-08-21. The old chime-then-show fired
#                                  TWO effects: with the 2500ms gap removed, the
#                                  second takeover audio_stops the first's cue
#                                  (effects_manager takeover semantics), so the
#                                  chime is gone entirely and the victory pool
#                                  lives on the BikeLockRoom effect itself)
#   options 1/2/4               -> WrongAnswer
# The answer key is static for the room and supplied by the room yaml
# substitutions, mirrored from triggers.json by the audio console.
# Spec: wiring-guides/room-games-plan.md.
# Sim/harness: `call <host>:<port> press_bike n=1` (n = 1-4).
# Real S3 wiring: buttons on D0-D3, LEDs hardwired to the 5V rail.
substitutions:
  bike_complete_effect: "BikeLockRoom"
  bike_correct_option: "3"

api:
  actions:
    - action: press_bike
      variables:
        n: int
      then:
        - script.execute:
            id: bike_press
            n: !lambda 'return n;'

script:
  - id: bike_press
    mode: single
    parameters:
      n: int
    then:
      - if:
          condition:
            lambda: 'return n == ${bike_correct_option};'
          then:
            - logger.log: "Bike quiz: correct option"
            - script.execute:
                id: bike_fire
                effect: "${bike_complete_effect}"
          else:
            - logger.log: "Bike quiz: wrong option"
            - script.execute:
                id: bike_fire
                effect: "WrongAnswer"
      - delay: 1500ms
  - id: bike_fire
    mode: queued
    parameters:
      effect: string
    then:
      - http_request.post:
          url: http://${server_host}:5000/api/run_effect
          request_headers:
            Content-Type: application/json
          json: !lambda |-
            root["room"] = "${room}";
            root["effect_name"] = effect;
