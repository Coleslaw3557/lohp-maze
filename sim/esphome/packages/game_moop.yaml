# Vertical Moop March game — 4 arcade buttons, one 60s round: the first press
# opens the round, every press fires the CorrectAnswer chime, all four unique
# buttons inside the round fire chime -> 2.5s -> ${moop_right_effect}, and the
# round timing out on a partial set fires ${moop_wrong_effect} and resets.
# (Rev 2026-08-16: buttons moved onto the room node — the standalone battery
# C3 puck design is dead. The round resolves HERE like every other game; the
# server's puck-era 60s aggregation in main.py is gone.)
# Spec: wiring-guides/room-games-plan.md.
# Sim/harness: `call <host>:<port> press_moop n=1` (n = 1-4).
# Real S3 wiring: buttons on D0-D3 (DB9-A pins 3-6), LEDs hardwired to the
# 5V rail; GPIO front-end feeds moop_press with a 30ms delayed_on debounce.
# (2026-08-17: an embedded-cue variant — WAVs in flash, played at press time —
# was built and REJECTED by Tim the same day: nothing is stored on nodes,
# full stop. All cues stream from the server; see room-node-audio-plan.md.)
substitutions:
  moop_right_effect: "VerticalMoopMarch-RightAnswer"
  moop_wrong_effect: "VerticalMoopMarch-WrongAnswer"

globals:
  - id: moop_mask
    type: int
    initial_value: '0'

api:
  actions:
    - action: press_moop
      variables:
        n: int
      then:
        - script.execute:
            id: moop_press
            n: !lambda 'return n;'

script:
  - id: moop_press
    mode: queued   # near-simultaneous presses are the SUCCESS path — drop none
    parameters:
      n: int
    then:
      - if:
          condition:
            lambda: 'return n >= 1 && n <= 4;'
          then:
            - lambda: |-
                bool first = (id(moop_mask) == 0);
                id(moop_mask) |= 1 << (n - 1);
                if (first) {
                  ESP_LOGI("moop", "Round open (60s): button %d first in", n);
                  id(moop_round).execute();
                }
                ESP_LOGI("moop", "Button %d latched (%d/4)", n,
                         __builtin_popcount(id(moop_mask)));
            - if:
                condition:
                  lambda: 'return id(moop_mask) == 0b1111;'
                then:
                  - script.stop: moop_round
                  - lambda: 'id(moop_mask) = 0;'
                  - logger.log: "Moop march: all four buttons — right answer"
                  - script.execute:
                      id: moop_resolve_right
                      n: !lambda 'return n;'
                else:
                  # repeat presses re-chime on purpose: the button always talks
                  - script.execute:
                      id: moop_fire
                      effect: "CorrectAnswer"
                      button: !lambda 'return "Moop Button " + to_string(n);'

  - id: moop_round
    mode: restart
    then:
      - delay: 60s
      - if:
          condition:
            lambda: 'return id(moop_mask) != 0;'
          then:
            - lambda: |-
                ESP_LOGI("moop", "Round timed out (%d/4)",
                         __builtin_popcount(id(moop_mask)));
                id(moop_mask) = 0;
            - script.execute:
                id: moop_fire
                effect: "${moop_wrong_effect}"
                button: ""

  - id: moop_resolve_right
    mode: single
    parameters:
      n: int
    then:
      - script.execute:
          id: moop_fire
          effect: "CorrectAnswer"
          button: !lambda 'return "Moop Button " + to_string(n);'
      - delay: 2500ms   # let the chime land before the victory pool
      - script.execute:
          id: moop_fire
          effect: "${moop_right_effect}"
          button: ""

  - id: moop_fire
    mode: queued
    parameters:
      effect: string
      button: string
    then:
      - http_request.post:
          url: http://${server_host}:5000/api/run_effect
          request_headers:
            Content-Type: application/json
          json: !lambda |-
            root["room"] = "${room}";
            root["effect_name"] = effect;
            if (button.length()) root["trigger_name"] = button;
