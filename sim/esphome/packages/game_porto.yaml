# Porto Room knock game: 3 pads, one random pass per room entry, with guardrails.
# The doorway tripwire randomizes the winning pad through `entry_hook` in
# tripwire.yaml. The winner stays stable while the room is occupied; vacate
# clears the seed so the next entry gets a fresh winner.
#
#   attempt 1     -> PortoHit, even on the winning pad
#   attempts 2-3  -> winning pad CorrectAnswer, other pads PortoHit
#   attempt 4+    -> CorrectAnswer, so nobody can get stuck
#
# Sim/harness: `call <host>:<port> press_porto n=1` (n = 1-3).
# Real S3 wiring: three piezo front-ends on D0-D2 via game_porto_hw.yaml.

globals:
  - id: porto_winner
    type: int
    initial_value: '0'
  - id: porto_entry_seeded
    type: bool
    initial_value: 'false'
  - id: porto_attempts
    type: int
    initial_value: '0'
  - id: porto_solved
    type: bool
    initial_value: 'false'

api:
  actions:
    - action: press_porto
      variables:
        n: int
      then:
        - script.execute:
            id: porto_press
            n: !lambda 'return n;'

script:
  - id: porto_randomize
    mode: restart
    then:
      - lambda: |-
          id(porto_winner) = random_uint32() % 3;
          id(porto_entry_seeded) = true;
          id(porto_attempts) = 0;
          id(porto_solved) = false;
      - logger.log:
          format: "Porto knock game: entry winner is pad %d"
          args: ['id(porto_winner) + 1']

  - id: porto_press
    mode: queued   # count real attempts instead of swallowing presses mid-effect
    max_runs: 4
    parameters:
      n: int
    then:
      - lambda: |-
          if (!id(porto_entry_seeded)) {
            id(porto_winner) = random_uint32() % 3;
            id(porto_entry_seeded) = true;
            id(porto_attempts) = 0;
            id(porto_solved) = false;
            ESP_LOGI("porto", "Porto knock game: lazy winner is pad %d", id(porto_winner) + 1);
          }
          if (n >= 1 && n <= 3 && !id(porto_solved)) id(porto_attempts) += 1;
      - if:
          condition:
            lambda: |-
              return id(porto_solved) || (
                n >= 1 && n <= 3 &&
                id(porto_attempts) >= 2 &&
                ((n - 1) == id(porto_winner) || id(porto_attempts) >= 4)
              );
          then:
            - lambda: 'id(porto_solved) = true;'
            - logger.log:
                format: "Porto knock game: PASS on attempt %d"
                args: ['id(porto_attempts)']
            - script.execute:
                id: porto_fire
                effect: "CorrectAnswer"
          else:
            - logger.log:
                format: "Porto knock game: fail on attempt %d"
                args: ['id(porto_attempts)']
            - script.execute:
                id: porto_fire
                effect: "PortoHit"
      - delay: 600ms

  - id: porto_fire
    mode: queued
    parameters:
      effect: string
    then:
      - http_request.post:
          url: http://${server_host}:5000/api/run_effect
          request_headers:
            Content-Type: application/json
          json: !lambda |-
            root["room"] = "${room}";
            root["effect_name"] = effect;
